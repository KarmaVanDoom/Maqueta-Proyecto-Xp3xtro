{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Sp3xtr0 Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: #eab308; font-weight: 900; font-size: 1.4rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none;">
        ⚡ SP3XTR0 <span style="color: #ffffff; font-size: 0.85rem; font-weight: 600; text-transform: uppercase;">Panel Admin</span>
    </a>
</h1>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Sobrescribir variables CSS de Django 5 Admin para ocupar el 100% del espacio */
    :root, html[data-theme="dark"], html[data-theme="light"], body {
        --primary: #eab308 !important;
        --secondary: #ca8a04 !important;
        --accent: #facc15 !important;
        
        --header-bg: #0f0f0f !important;
        --header-color: #ffffff !important;
        --header-link-color: #eab308 !important;
        
        --breadcrumbs-bg: #0a0a0a !important;
        --breadcrumbs-link-color: #eab308 !important;
        
        --body-bg: #0a0a0a !important;
        --body-quiet-color: #9ca3af !important;
        --body-fg: #ffffff !important;
        --body-loud-color: #ffffff !important;

        --darkened-bg: #121212 !important;
        --selected-bg: #1f1f1f !important;
        --selected-row: rgba(234, 179, 8, 0.1) !important;
        
        --link-color: #eab308 !important;
        --link-hover-color: #facc15 !important;
        --link-selected-bg: #1a1a1a !important;
        
        --button-bg: #eab308 !important;
        --button-hover-bg: #facc15 !important;
        --button-fg: #000000 !important;

        --border-color: rgba(255, 255, 255, 0.1) !important;
    }

    #header {
        background: #0f0f0f !important;
        border-bottom: 2px solid #eab308 !important;
    }

    /* Expandir contenido al 100% de la ventana */
    #container {
        min-height: 100vh !important;
        background-color: #0a0a0a !important;
    }

    #content {
        max-width: 100% !important;
        padding: 25px 40px !important;
    }

    #content-main {
        float: none !important;
        width: 100% !important;
    }

    .module h2, .module caption, th, tr.header {
        background: #181818 !important;
        color: #eab308 !important;
        font-weight: 800 !important;
    }

    .button, input[type=submit], input[type=button], .submit-row input {
        background: #eab308 !important;
        color: #000000 !important;
        font-weight: 800 !important;
    }
</style>
{% endblock %}
